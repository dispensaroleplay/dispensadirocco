<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#080705" />
    <title>Déclaration de production | La Dispensa Di Rocco</title>
    <link rel="icon" href="/assets/logo.webp" type="image/webp" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Montserrat:wght@300;400;500;600&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --bg: #080705;
        --panel: #12100c;
        --text: #f4efe6;
        --muted: #aaa398;
        --gold: #c99645;
        --gold-light: #e2ba78;
        --line: rgba(201, 150, 69, 0.24);
        --green: #34b56c;
        --red: #d6555f;
        --serif: "Cormorant Garamond", Georgia, serif;
        --sans: "Montserrat", Arial, sans-serif;
      }

      * { box-sizing: border-box; }

      body {
        margin: 0;
        min-height: 100vh;
        color: var(--text);
        background:
          radial-gradient(circle at 12% 8%, rgba(52, 181, 108, 0.12), transparent 28rem),
          radial-gradient(circle at 88% 0%, rgba(201, 150, 69, 0.14), transparent 26rem),
          radial-gradient(circle at 80% 90%, rgba(214, 85, 95, 0.1), transparent 24rem),
          var(--bg);
        font-family: var(--sans);
      }

      .noise {
        pointer-events: none;
        position: fixed;
        inset: 0;
        z-index: 0;
        opacity: 0.022;
        background-image: radial-gradient(#fff 0 1px, transparent 1px);
        background-size: 24px 24px;
      }

      .page {
        position: relative;
        z-index: 1;
        width: min(100% - 32px, 720px);
        margin: 0 auto;
        padding: 34px 0 56px;
      }

      .topbar {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 16px;
        margin-bottom: 28px;
      }

      .brand {
        display: flex;
        align-items: center;
        gap: 14px;
        min-width: 0;
        color: inherit;
        text-decoration: none;
      }

      .brand img {
        width: 52px;
        height: 52px;
        object-fit: cover;
        border-radius: 50%;
        border: 1px solid rgba(255, 255, 255, 0.28);
      }

      .brand span {
        overflow: hidden;
        font-size: 0.78rem;
        font-weight: 500;
        letter-spacing: 0.18em;
        text-transform: uppercase;
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      .top-link {
        color: var(--gold-light);
        font-size: 0.78rem;
        font-weight: 500;
        letter-spacing: 0.08em;
        text-decoration: none;
        text-transform: uppercase;
      }

      .top-link:hover { color: var(--gold); }

      .tricolore {
        display: grid;
        grid-template-columns: 1fr 1fr 1fr;
        width: 100%;
        height: 4px;
        margin-bottom: 22px;
        overflow: hidden;
        border-radius: 999px;
      }

      .tricolore span:nth-child(1) { background: var(--green); }
      .tricolore span:nth-child(2) { background: #f4efe6; }
      .tricolore span:nth-child(3) { background: var(--red); }

      .card {
        padding: clamp(24px, 4vw, 38px);
        background: linear-gradient(180deg, rgba(18, 16, 12, 0.96), rgba(10, 9, 7, 0.98));
        border: 1px solid var(--line);
        border-radius: 22px;
        box-shadow: 0 28px 70px rgba(0, 0, 0, 0.35);
      }

      .eyebrow {
        margin: 0 0 12px;
        color: var(--gold-light);
        font-size: 0.72rem;
        font-weight: 500;
        letter-spacing: 0.16em;
        text-transform: uppercase;
      }

      h1 {
        margin: 0 0 10px;
        font-family: var(--serif);
        font-size: clamp(2.1rem, 5vw, 3rem);
        font-weight: 500;
        letter-spacing: -0.03em;
        line-height: 1.05;
      }

      h1 em {
        color: var(--gold-light);
        font-style: italic;
        font-weight: 600;
      }

      .lead {
        margin: 0 0 28px;
        max-width: 38ch;
        color: var(--muted);
        font-size: 0.95rem;
        font-weight: 300;
        line-height: 1.65;
      }

      .field { margin-bottom: 18px; }

      .field > label {
        display: block;
        margin: 0 0 9px;
        color: var(--text);
        font-size: 0.82rem;
        font-weight: 500;
        letter-spacing: 0.04em;
      }

      .field > label span { color: var(--red); }

      input[type="text"],
      input[type="number"] {
        width: 100%;
        min-height: 52px;
        padding: 0 16px;
        color: var(--text);
        background: rgba(255, 255, 255, 0.03);
        border: 1px solid var(--line);
        border-radius: 12px;
        outline: none;
        font: inherit;
        transition: border-color 160ms ease, box-shadow 160ms ease;
      }

      input[type="text"]:focus,
      input[type="number"]:focus {
        border-color: rgba(201, 150, 69, 0.55);
        box-shadow: 0 0 0 3px rgba(201, 150, 69, 0.12);
      }

      .upload {
        display: block;
        padding: 22px 18px;
        color: inherit;
        background: rgba(255, 255, 255, 0.025);
        border: 1px dashed rgba(201, 150, 69, 0.42);
        border-radius: 14px;
        cursor: pointer;
        text-align: center;
        transition: background 160ms ease, border-color 160ms ease;
      }

      .upload:hover {
        background: rgba(201, 150, 69, 0.06);
        border-color: rgba(201, 150, 69, 0.7);
      }

      .upload strong {
        display: block;
        margin-bottom: 8px;
        color: var(--gold-light);
        font-size: 0.92rem;
        font-weight: 500;
      }

      .upload small {
        color: var(--muted);
        font-size: 0.78rem;
        font-weight: 300;
        line-height: 1.5;
      }

      .upload input {
        display: block;
        width: min(100%, 320px);
        margin: 16px auto 0;
        color: var(--muted);
        font-size: 0.82rem;
      }

      .preview {
        display: none;
        grid-template-columns: repeat(auto-fill, minmax(92px, 1fr));
        gap: 10px;
        margin-top: 14px;
      }

      .preview.show { display: grid; }

      .preview img {
        width: 100%;
        aspect-ratio: 1;
        object-fit: cover;
        border: 1px solid var(--line);
        border-radius: 12px;
      }

      .actions {
        display: flex;
        justify-content: flex-end;
        margin-top: 26px;
      }

      button[type="submit"] {
        min-height: 52px;
        padding: 0 26px;
        color: #1a140c;
        background: linear-gradient(135deg, var(--gold-light), var(--gold));
        border: 0;
        border-radius: 999px;
        font: inherit;
        font-size: 0.84rem;
        font-weight: 600;
        letter-spacing: 0.06em;
        text-transform: uppercase;
        cursor: pointer;
        transition: transform 160ms ease, filter 160ms ease;
      }

      button[type="submit"]:hover {
        filter: brightness(1.05);
        transform: translateY(-1px);
      }

      button[type="submit"]:disabled {
        opacity: 0.65;
        cursor: wait;
        transform: none;
      }

      #form-status {
        min-height: 1.4em;
        margin: 16px 0 0;
        color: var(--muted);
        font-size: 0.9rem;
        font-weight: 400;
      }

      #form-status[data-state="error"] { color: var(--red); }
      #form-status[data-state="success"] { color: var(--green); }

      @media (max-width: 560px) {
        .brand span { max-width: 16ch; }
        .card { padding: 22px 18px; }
        .actions { justify-content: stretch; }
        button[type="submit"] { width: 100%; }
      }
    </style>
  </head>
  <body>
    <div class="noise" aria-hidden="true"></div>

    <main class="page">
      <div class="topbar">
        <a class="brand" href="/">
          <img src="/assets/logo.webp" alt="" width="52" height="52" />
          <span>La Dispensa Di Rocco</span>
        </a>
        <a class="top-link" href="/admin/logout">Déconnexion</a>
      </div>

      <div class="tricolore" aria-hidden="true"><span></span><span></span><span></span></div>

      <section class="card">
        <p class="eyebrow">Admin · Production</p>
        <h1>Nouvelle <em>déclaration</em></h1>
        <p class="lead">
          Envoie le stock produit avec une ou plusieurs preuves. Validation Discord
          avant écriture dans Google Sheets.
        </p>

        <form id="production-form">
          <div class="field">
            <label for="name">Nom <span>*</span></label>
            <input id="name" name="name" type="text" required autocomplete="name" />
          </div>

          <div class="field">
            <label for="stock">Stock produit <span>*</span></label>
            <input id="stock" name="stock" type="number" min="0" step="1" required />
          </div>

          <div class="field">
            <label for="proof">Preuves photo <span>*</span></label>
            <label class="upload" for="proof">
              <strong id="upload-title">Choisir une ou plusieurs images</strong>
              <small>PNG, JPG, WEBP — max 10 fichiers, 8 Mo chacun</small>
              <input
                id="proof"
                name="proof"
                type="file"
                accept="image/png,image/jpeg,image/jpg,image/webp,image/*"
                multiple
                required
              />
            </label>
            <div id="preview" class="preview" aria-live="polite"></div>
          </div>

          <div class="actions">
            <button id="submit-button" type="submit">
              <span id="submit-label">Envoyer la déclaration</span>
            </button>
          </div>
          <p id="form-status" role="status"></p>
        </form>
      </section>
    </main>

    <script>
      (() => {
        const form = document.getElementById("production-form");
        const proof = document.getElementById("proof");
        const title = document.getElementById("upload-title");
        const preview = document.getElementById("preview");
        const status = document.getElementById("form-status");
        const button = document.getElementById("submit-button");
        const label = document.getElementById("submit-label");
        const maxFiles = 10;
        const maxSize = 8 * 1024 * 1024;
        let urls = [];

        const setStatus = (message, state = "") => {
          status.textContent = message;
          status.dataset.state = state;
        };

        const clearPreview = () => {
          for (const url of urls) URL.revokeObjectURL(url);
          urls = [];
          preview.innerHTML = "";
          preview.classList.remove("show");
          title.textContent = "Choisir une ou plusieurs images";
        };

        proof.addEventListener("change", () => {
          const files = [...proof.files];
          clearPreview();
          if (!files.length) return;

          if (files.length > maxFiles) {
            proof.value = "";
            setStatus("Maximum 10 images.", "error");
            return;
          }

          for (const file of files) {
            const okType =
              String(file.type || "").startsWith("image/") ||
              /\.(png|jpe?g|webp)$/i.test(file.name || "");
            if (!okType || file.size === 0 || file.size > maxSize) {
              proof.value = "";
              clearPreview();
              setStatus("Image invalide (PNG/JPG/WEBP, max 8 Mo).", "error");
              return;
            }
          }

          title.textContent =
            files.length === 1
              ? files[0].name
              : `${files.length} images sélectionnées`;

          for (const file of files) {
            const url = URL.createObjectURL(file);
            urls.push(url);
            const img = document.createElement("img");
            img.src = url;
            img.alt = file.name;
            preview.appendChild(img);
          }
          preview.classList.add("show");
          setStatus("");
        });

        form.addEventListener("submit", async (event) => {
          event.preventDefault();
          const name = form.elements.name.value.trim();
          const stock = form.elements.stock.value;
          const files = [...proof.files];

          if (!name || stock === "" || !files.length) {
            setStatus("Remplis nom, stock et au moins une image.", "error");
            return;
          }

          button.disabled = true;
          label.textContent = "Envoi…";
          setStatus("Transmission en cours…");

          try {
            const body = new FormData();
            body.append("name", name);
            body.append("stock", stock);
            for (const file of files) body.append("proof", file);

            const response = await fetch("/api/submit", {
              method: "POST",
              body,
              credentials: "same-origin"
            });
            const data = await response.json().catch(() => ({}));
            if (!response.ok || data.ok === false) {
              throw new Error(data.error || `HTTP ${response.status}`);
            }

            form.reset();
            clearPreview();
            setStatus(data.message || "Déclaration envoyée.", "success");
          } catch (error) {
            setStatus(`Échec : ${error.message || "erreur"}`, "error");
          } finally {
            button.disabled = false;
            label.textContent = "Envoyer la déclaration";
          }
        });
      })();
    </script>
  </body>
</html>
